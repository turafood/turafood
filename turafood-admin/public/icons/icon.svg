<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A36"/>
      <stop offset="50%" stop-color="#FF441F"/>
      <stop offset="100%" stop-color="#D92D07"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="128" fill="url(#innerGlow)"/>
  <!-- Central Icon Container -->
  <g filter="url(#shadow)">
    <!-- Plate / Ring -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-opacity="0.4"/>
    <!-- Logo Typography 't' -->
    <text x="256" y="325" font-family="Bricolage Grotesque, system-ui, -apple-system, sans-serif" font-size="220" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-6">t</text>
    <!-- AI Sparkle Tag -->
    <circle cx="360" cy="150" r="32" fill="#FFB020"/>
    <path d="M360 134 L364 146 L376 150 L364 154 L360 166 L356 154 L344 150 L356 146 Z" fill="#FFFFFF"/>
  </g>
</svg>